name: Deploy to IONOS

# Manual trigger only — production deploy over SSH/SCP (mirrors wsp-cast-sender's pattern).
on:
  workflow_dispatch:

concurrency:
  group: ssh-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-and-deploy:
    name: Build · Deploy to IONOS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify build output
        run: |
          ls -la dist/
          echo "files: $(find dist -type f | wc -l)"
          test -f dist/index.html

      - name: Backup current deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            if [ -d "${{ secrets.DEPLOY_PATH }}" ]; then
              mkdir -p "${{ secrets.DEPLOY_PATH }}-backups"
              cp -r "${{ secrets.DEPLOY_PATH }}" "${{ secrets.DEPLOY_PATH }}-backups/backup-$(date +%Y%m%d_%H%M%S)" || echo "backup failed, continuing"
            fi
            mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Upload dist via SCP (clean replace)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/"
          strip_components: 1
          rm: true

      - name: Set permissions and report
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            find "${{ secrets.DEPLOY_PATH }}" -type f -exec chmod 644 {} \;
            find "${{ secrets.DEPLOY_PATH }}" -type d -exec chmod 755 {} \;
            echo "✅ deployed $(find "${{ secrets.DEPLOY_PATH }}" -type f | wc -l) files to ${{ secrets.DEPLOY_PATH }}"

      - name: Prune old backups (keep last 3)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}-backups" 2>/dev/null && ls -t | tail -n +4 | xargs rm -rf || echo "no old backups to prune"
